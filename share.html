<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Share Pin — Board-to-X Sync</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e6e6e6; background: #12121a; }
    a { color: #8ab4ff; }
    .note { color: #9a9a9a; }
    button.secondary { background: #2a2a35; color: #e6e6e6; }
  }
  img { display: block; width: 100%; border-radius: 12px; background: rgba(127,127,127,0.15); min-height: 120px; }
  .text { white-space: pre-wrap; word-break: break-word; margin: 16px 0; }
  button {
    display: block; width: 100%; padding: 14px; margin: 10px 0;
    font-size: 1em; font-weight: 600; border: none; border-radius: 999px; cursor: pointer;
    background: #1a1a1a; color: #fff;
  }
  button.secondary { background: #eee; color: #1a1a1a; }
  button:disabled { opacity: 0.5; cursor: default; }
  .note { color: #666; font-size: 0.85em; }
  .error { color: #d33; }
</style>
</head>
<body>

<img id="preview" alt="">
<p class="text" id="text"></p>

<button id="share" disabled>画像を読み込み中…</button>
<button id="intent" class="secondary">画像なしで X に投稿</button>

<p class="note" id="status">「画像つきで共有」を押して、共有メニューから X を選んでください。</p>

<script>
  const params = new URLSearchParams(location.search);
  const text = params.get("text") || "";
  const pinUrl = params.get("url") || "";
  const imgParam = params.get("img") || "";
  const $ = (id) => document.getElementById(id);
  const status = (msg, isError) => { $("status").textContent = msg; $("status").className = isError ? "note error" : "note"; };

  // Pinterest の Pin / 画像以外は受け付けない
  const isPin = /^https:\/\/(www\.)?pinterest\.[a-z.]+\/pin\/\d+\/?$/.test(pinUrl);
  const isPinImg = /^https:\/\/i\.pinimg\.com\//.test(imgParam);
  const postText = [text, isPin ? pinUrl : ""].filter(Boolean).join("\n");

  $("text").textContent = postText;
  $("intent").onclick = () => {
    const q = new URLSearchParams({ text });
    if (isPin) q.set("url", pinUrl);
    location.href = "https://x.com/intent/post?" + q.toString();
  };

  let file = null;
  (async () => {
    if (!isPinImg) { status("画像 URL が不正です。", true); $("share").textContent = "画像なし"; return; }
    // RSS のサムネイル (236x) を大きいサイズに差し替え
    const img = imgParam.replace(/\/\d+x\//, "/736x/");
    $("preview").src = img;
    try {
      // i.pinimg.com は CORS を返さないため、CORS 対応の画像プロキシ経由で取得
      const res = await fetch("https://images.weserv.nl/?url=" + encodeURIComponent(img.replace(/^https:\/\//, "")));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      file = new File([blob], "pin.jpg", { type: blob.type || "image/jpeg" });
      if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
        status("このブラウザは画像の共有に対応していません。スマホで開くか、「画像なしで X に投稿」を使ってください。", true);
        $("share").textContent = "画像つき共有は非対応";
        return;
      }
      $("share").disabled = false;
      $("share").textContent = "画像つきで共有";
    } catch (e) {
      status("画像の取得に失敗しました（" + e.message + "）。「画像なしで X に投稿」を使ってください。", true);
      $("share").textContent = "画像を取得できません";
    }
  })();

  $("share").onclick = async () => {
    try {
      await navigator.share({ files: [file], text: postText });
      status("共有メニューを閉じました。");
    } catch (e) {
      if (e.name !== "AbortError") status("共有に失敗しました（" + e.message + "）", true);
    }
  };
</script>

</body>
</html>
